disabled_rules:
  - trailing_whitespace
  - line_length
  - force_cast
  - type_name
  - cyclomatic_complexity
  - function_body_length
  - file_length
  - implicit_optional_initialization

opt_in_rules:
  - empty_count

identifier_name:
  min_length: 1

excluded:
  - Pods
  - build
  - DerivedData

reporter: "xcode"
